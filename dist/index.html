<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="本机计算的专业八字排盘工具，不提供命理解读。">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="八字排盘">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
  <title>八字排盘</title>
</head>
<body>
  <main class="app-shell">
    <header class="app-header"><span>八字排盘</span></header>

    <section id="home-screen" class="app-screen home-screen" aria-label="首页">
      <form id="chart-form" class="entry-card">
        <label class="entry-row name-row"><span>姓名</span><input id="chart-name" type="text" autocomplete="off" placeholder="请输入姓名"></label>
        <div class="entry-choice-row">
          <div class="segmented" role="group" aria-label="性别"><button type="button" data-gender="1" aria-pressed="true">男</button><button type="button" data-gender="0" aria-pressed="false">女</button></div>
          <div class="segmented calendar-segment" role="group" aria-label="历法"><button type="button" data-calendar="solar" aria-pressed="true">公历</button><button type="button" data-calendar="lunar" aria-pressed="false">农历</button><button type="button" data-calendar="four" aria-pressed="false">四柱</button></div>
          <select id="gender" class="visually-hidden" aria-hidden="true" tabindex="-1"><option value="1">男</option><option value="0">女</option></select>
          <select id="calendar-type" class="visually-hidden" aria-hidden="true" tabindex="-1"><option value="solar">公历</option><option value="lunar">农历</option></select>
        </div>
        <button id="birth-trigger" class="entry-row entry-action" type="button"><span>出生时间<small>（必填）</small></span><span class="entry-value"><span id="birth-summary"></span><b>›</b></span></button>
        <div class="entry-row muted-row"><span>出生地点</span><span>未知地 · 北京时间 <b>›</b></span></div>
        <div class="entry-row muted-row"><span>分组</span><span>全部 <b>›</b></span></div>
        <div class="entry-foot"><span>真太阳时：暂未启用<br>案例仅保存在此设备</span><label class="save-label">保存 <input id="auto-save" type="checkbox" role="switch"><i aria-hidden="true"></i></label></div>
        <details class="settings-panel"><summary>排盘设置</summary>
          <label class="field"><span>子时换日</span><select id="zi-rule"><option value="23">23:00 换日（原版默认）</option><option value="24">24:00 换日</option></select></label>
          <label class="field"><span>起运方式</span><select id="yun-mode"><option value="year">按年（原版默认）</option><option value="cumulative">按岁累加</option><option value="simple">按岁简化</option><option value="rounded">按岁舍入</option></select></label>
        </details>
        <button class="start-button" type="submit">开始排盘</button>
        <p id="error" class="error" role="alert" hidden></p>
      </form>

      <section class="instant-card" aria-label="打开时刻的排盘">
        <div><div id="instant-pillars" class="instant-pillars"></div><small id="instant-lunar"></small><small id="instant-solar"></small></div>
        <div class="instant-action"><strong id="instant-hour"></strong><button id="instant-chart" type="button">即时排盘</button><small class="refresh-hint">刷新页面更新即时盘</small></div>
      </section>
      <div class="future-grid"><button id="current-chart" class="future-slot current-chart" type="button"><span class="current-chart-icon">☯</span><span>当前排盘</span><small id="current-chart-hint">排盘后在这里查看</small></button><div class="future-slot tall" aria-label="预留功能"></div><div class="future-slot" aria-label="预留功能"></div></div>
    </section>

    <section id="chart-screen" class="app-screen chart-screen" aria-label="当前排盘" hidden>
      <div id="chart-empty" class="chart-empty">排盘后，结果将在这里显示</div>
      <section class="result" id="result" aria-live="polite" hidden>
        <div class="result-heading"><h2 id="result-title">传统排盘</h2><button id="taiyuan-toggle" class="taiyuan-toggle" type="button" aria-pressed="false">胎元 关</button><button id="edit-birth" type="button">修改出生信息</button><button id="display-trigger" type="button" aria-label="显示设置">⚙</button></div><p id="case-save-feedback" class="case-save-feedback" role="status" hidden></p>
        <div class="result-birth"><strong id="result-qian-kun"></strong><span id="result-lunar"></span><span id="result-date"></span></div>
        <div class="term-brief"><div id="term-prior"></div><div id="term-birth"></div></div>
        <div class="mode-tabs" aria-label="排盘显示方式"><button data-mode="traditional" type="button">传统排盘</button><button data-mode="fullscreen" type="button">全盘</button><button data-mode="simple" type="button">精简</button></div>
        <div id="mode-output"></div>
        <p class="note">仅提供排盘数据；部分神煞结果仍在对照原版。</p>
      </section>
    </section>
    <section id="cases-screen" class="app-screen cases-screen" aria-label="案例" hidden>
      <div class="cases-top"><strong>我的案例</strong><span>保存在此设备</span></div>
      <div class="case-search"><span aria-hidden="true">⌕</span><input id="case-search-input" type="search" placeholder="搜索姓名或出生日期" aria-label="搜索案例"></div>
      <div class="case-filter"><button class="active" type="button">全部</button><button type="button" disabled>分组待接入</button><button type="button" disabled>筛选待接入</button><button type="button" disabled>编辑待接入</button></div>
      <div id="cases-list" class="cases-list"></div>
      <p id="cases-empty" class="cases-empty">还没有收藏的案例<br>打开首页“保存”，排盘后会自动收录</p>
      <p id="cases-error" class="cases-error" role="alert" hidden></p>
    </section>
    <section id="study-screen" class="app-screen empty-screen" aria-label="学堂" hidden></section>
    <section id="settings-screen" class="app-screen empty-screen" aria-label="设置" hidden></section>

    <nav class="bottom-nav" aria-label="页面导航"><button data-nav="home" aria-current="page" type="button"><span>◉</span>首页</button><button data-nav="cases" type="button"><span>▤</span>案例</button><button data-nav="study" type="button"><span>▦</span>学堂</button><button data-nav="settings" type="button"><span>⚙</span>设置</button></nav>
  </main>

  <dialog id="birth-sheet" class="sheet-dialog"><div class="sheet-head"><h2>出生时间</h2><button id="birth-close" type="button" aria-label="关闭">×</button></div>
    <div id="solar-input-panel"><div class="quick-entry"><input id="birth-shortcut" type="text" inputmode="numeric" maxlength="13" placeholder="出生年月日时分，如 20030506.0720" aria-label="快捷输入出生年月日时分"><button id="shortcut-confirm" type="button">确认</button></div><p class="quick-entry-hint">输入后点确认，自动填入下方时间</p></div>
    <div class="date-fields"><label>年<input id="year" type="number" min="1801" max="2099"></label><label class="solar-only">月<input id="month" type="number" min="1" max="12"></label><label class="solar-only">日<input id="day" type="number" min="1" max="31"></label><label class="solar-only">时<input id="hour" type="number" min="0" max="23"></label><label class="solar-only">分<input id="minute" type="number" min="0" max="59"></label></div>
    <input id="leap" type="checkbox" hidden>
    <div id="lunar-wheel-panel" hidden><div class="lunar-wheel-labels"><span>年</span><span>月</span><span>日</span><span>时</span><span>分</span></div><div class="lunar-wheels"><div class="lunar-wheel" data-wheel="year" aria-label="农历年份"></div><div class="lunar-wheel" data-wheel="month" aria-label="农历月份"></div><div class="lunar-wheel" data-wheel="day" aria-label="农历日期"></div><div class="lunar-wheel" data-wheel="hour" aria-label="出生时辰"></div><div class="lunar-wheel" data-wheel="minute" aria-label="出生分钟"></div></div></div>
    <label class="check summer-time-check"><input id="summer-time" type="checkbox"><span>夏令时</span><button id="summer-help" type="button" aria-label="夏令时说明">?</button></label><p id="summer-hint" class="summer-hint">勾选后按排盘宝规则减去 1 小时；支持中国大陆 1986—1991 年时段。</p>
    <div class="date-actions"><button id="use-now" type="button">此刻</button><button id="birth-confirm" type="button">确定</button></div>
    <p id="now-status" class="now-status" role="status" hidden></p><p id="date-error" class="error" role="alert" hidden></p>
  </dialog>

  <dialog id="four-sheet" class="sheet-dialog four-sheet"><div class="sheet-head"><h2>四柱反推</h2><div class="four-actions"><button id="four-confirm" type="button" disabled>确定</button><button id="four-close" type="button" aria-label="关闭">×</button></div></div>
    <div class="four-slot-labels"><span>年柱</span><span>月柱</span><span>日柱</span><span>时柱</span></div>
    <div id="four-slots" class="four-slots" aria-label="四柱选择"></div>
    <div class="four-range"><b>查找范围：</b><span>1801—2099年</span><button id="four-clear" type="button">清除</button></div>
    <div id="four-options" class="stem-grid" aria-label="当前可选干支"></div>
    <div id="four-candidates" class="four-candidates" hidden><p>请选择对应的出生日期</p><div id="four-candidate-list"></div></div>
    <p id="four-hint" class="four-hint">先选年柱天干，再选地支。</p><p id="four-error" class="error" role="alert" hidden></p>
  </dialog>

  <dialog id="display-sheet" class="sheet-dialog display-sheet"><div class="sheet-head"><h2>显示设置</h2><button id="display-close" type="button" aria-label="关闭">×</button></div>
    <div class="display-settings option-grid"><label class="check"><input id="show-hidden" type="checkbox" checked><span>显示藏干</span></label><label class="check"><input id="show-nayin" type="checkbox" checked><span>显示纳音</span></label><label class="check"><input id="show-stage" type="checkbox" checked><span>显示长生</span></label><label class="check"><input id="show-empty" type="checkbox" checked><span>显示空亡</span></label><label class="check"><input id="show-shensha" type="checkbox" checked><span>显示神煞</span></label><label class="check"><input id="show-gates" type="checkbox"><span>显示关卡</span></label></div>
  </dialog>
  <script src="lunar.js"></script><script src="apk-terms-data.js"></script><script src="apk-terms.js"></script><script src="shen-sha.js"></script><script src="case-store.js"></script><script src="app.js"></script>
</body>
</html>
