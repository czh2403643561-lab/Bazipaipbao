<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#17252b">
  <meta name="description" content="个人学习用八字排盘工具预览版">
  <title>八字排盘 · 学习工具</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="shell">
    <header class="hero">
      <span class="eyebrow">个人学习工具 · 本地计算</span>
      <h1>八字排盘</h1>
      <p>按原版的输入逻辑填写出生资料，在手机上查看四种排盘样式。</p>
    </header>

    <section class="panel" aria-labelledby="input-title">
      <div class="section-heading"><h2 id="input-title">出生信息</h2><span>按北京时间填写</span></div>
      <form id="chart-form">
        <div class="field-row">
          <label class="field"><span>排盘名</span><input id="chart-name" type="text" autocomplete="name" placeholder="可不填"></label>
          <label class="field"><span>出生地</span><input id="birth-place" type="text" placeholder="可不填"></label>
        </div>
        <div class="field-row">
          <label class="field"><span>历法</span><select id="calendar-type"><option value="solar">公历</option><option value="lunar">农历</option></select></label>
          <label class="field"><span>性别</span><select id="gender"><option value="1">男</option><option value="0">女</option></select></label>
        </div>
        <div class="field-row triple">
          <label class="field"><span>年</span><input id="year" type="number" min="1901" max="2099" placeholder="1990" required></label>
          <label class="field"><span>月</span><input id="month" type="number" min="1" max="12" placeholder="5" required></label>
          <label class="field"><span>日</span><input id="day" type="number" min="1" max="31" placeholder="17" required></label>
        </div>
        <label class="check hidden" id="leap-wrap"><input id="leap" type="checkbox"><span>农历闰月</span></label>
        <div class="field-row">
          <label class="field"><span>时</span><input id="hour" type="number" min="0" max="23" placeholder="8" required></label>
          <label class="field"><span>分</span><input id="minute" type="number" min="0" max="59" placeholder="30" required></label>
        </div>
        <label class="field"><span>子时换日</span><select id="zi-rule"><option value="23">23:00 换日（原软件默认）</option><option value="24">24:00 换日（待核对）</option></select></label>
        <div class="option-grid" aria-label="高级排盘选项">
          <label class="check"><input id="early-zi" type="checkbox"><span>早晚子</span></label>
          <label class="check"><input id="unknown-time" type="checkbox"><span>时辰不确定</span></label>
          <label class="check"><input id="dst" type="checkbox"><span>夏令时</span></label>
          <label class="check"><input id="true-solar" type="checkbox"><span>真太阳时</span></label>
        </div>
        <p class="option-note">真太阳时需要经纬度；当前先保留原版入口，尚未参与计算。</p>
        <label class="field"><span>显示模式</span><select id="display-mode"><option value="traditional">传统</option><option value="fullscreen">全屏</option><option value="simple">精简</option><option value="analysis">分析</option></select></label>
        <button class="primary" type="submit">排盘</button>
        <p id="error" class="error" role="alert" hidden></p>
      </form>
    </section>

    <section class="panel result" id="result" aria-live="polite" hidden>
      <div class="section-heading"><h2 id="result-title">八字盘</h2><span id="result-date"></span></div>
      <div class="mode-tabs" aria-label="排盘显示方式">
        <button data-mode="traditional" type="button">传统</button><button data-mode="fullscreen" type="button">全屏</button><button data-mode="simple" type="button">精简</button><button data-mode="analysis" type="button">分析</button>
      </div>
      <div id="mode-output"></div>
      <p class="note">四柱、大运、流年按开源历法本地计算；真太阳时、神煞和部分设置仍在逐项对照原版。</p>
    </section>

    <footer>数据只保留在当前页面，不上传出生信息。</footer>
  </main>
  <script src="lunar.js"></script>
  <script src="app.js"></script>
</body>
</html>
