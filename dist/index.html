<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#8d2a23">
  <meta name="description" content="面向专业使用者的八字排盘工具；本机计算，不提供命理解读。">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="八字排盘">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <title>八字排盘 · 学习工具</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="shell">
    <header class="hero">
      <span class="eyebrow">专业排盘工具 · 本机计算</span>
      <h1>八字排盘</h1>
      <p>清晰查看四柱、神煞、大运与流年，不提供命理解读。</p>
    </header>

    <section class="panel" aria-labelledby="input-title">
      <div class="section-heading"><h2 id="input-title">出生信息</h2><button class="now-button" id="use-now" type="button">此刻</button></div>
      <form id="chart-form">
        <label class="field"><span>排盘名（可选）</span><input id="chart-name" type="text" autocomplete="off" placeholder="用于标记本次排盘"></label>
        <div class="field-row">
          <label class="field"><span>历法</span><select id="calendar-type"><option value="solar">公历</option><option value="lunar">农历</option></select></label>
          <label class="field"><span>性别</span><select id="gender"><option value="1">男</option><option value="0">女</option></select></label>
        </div>
        <div class="field-row triple">
          <label class="field"><span>年</span><input id="year" type="number" min="1901" max="2099" placeholder="1990" required></label>
          <label class="field"><span>月</span><input id="month" type="number" min="1" max="12" placeholder="5" required></label>
          <label class="field"><span>日</span><input id="day" type="number" min="1" max="31" placeholder="17" required></label>
        </div>
        <label class="check hidden" id="leap-wrap"><input id="leap" type="checkbox"><span>农历闰月</span></label>
        <div class="field-row">
          <label class="field"><span>时</span><input id="hour" type="number" min="0" max="23" placeholder="8" required></label>
          <label class="field"><span>分</span><input id="minute" type="number" min="0" max="59" placeholder="30" required></label>
        </div>
        <details class="settings-panel">
          <summary>排盘设置</summary>
          <label class="field"><span>子时换日</span><select id="zi-rule"><option value="23">23:00 换日（原版默认）</option><option value="24">24:00 换日</option></select></label>
          <label class="field"><span>起运方式</span><select id="yun-mode"><option value="year">按年（原版默认）</option><option value="cumulative">按岁累加</option><option value="simple">按岁简化</option><option value="rounded">按岁舍入</option></select></label>
        </details>
        <button class="primary" type="submit">排盘</button>
        <p id="now-status" class="now-status" role="status" aria-live="polite" hidden></p>
        <p id="error" class="error" role="alert" hidden></p>
      </form>
    </section>

    <section class="panel result" id="result" aria-live="polite" hidden>
      <div class="section-heading"><h2 id="result-title">八字盘</h2><span id="result-date"></span></div>
      <div class="mode-tabs" aria-label="排盘显示方式">
        <button data-mode="traditional" type="button">传统排盘</button><button data-mode="fullscreen" type="button">全盘</button><button data-mode="simple" type="button">精简</button>
      </div>
      <details class="display-settings">
        <summary>显示设置</summary>
        <div class="option-grid">
          <label class="check"><input id="show-hidden" type="checkbox" checked><span>显示藏干</span></label>
          <label class="check"><input id="show-nayin" type="checkbox" checked><span>显示纳音</span></label>
          <label class="check"><input id="show-stage" type="checkbox" checked><span>显示长生</span></label>
          <label class="check"><input id="show-empty" type="checkbox" checked><span>显示空亡</span></label>
          <label class="check"><input id="show-shensha" type="checkbox" checked><span>显示神煞（49 项已接入）</span></label>
          <label class="check"><input id="show-gates" type="checkbox"><span>显示关卡（9 项已接入，原版默认关闭）</span></label>
          <label class="check"><input id="show-extras" type="checkbox" checked><span>显示胎元、命身宫</span></label>
        </div>
      </details>
      <div id="mode-output"></div>
      <p class="note">本工具只提供排盘数据，不包含命理解读。49 项四柱神煞和 9 项关卡规则已接入，部分结果仍在对照原版；四柱、大运和流年在本机计算。</p>
    </section>

    <footer>纯排盘工具 · 出生资料仅在本机计算，不上传。</footer>
  </main>
  <script src="lunar.js"></script>
  <script src="apk-terms-data.js"></script>
  <script src="apk-terms.js"></script>
  <script src="shen-sha.js"></script>
  <script src="app.js"></script>
</body>
</html>
